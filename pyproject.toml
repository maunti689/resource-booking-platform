[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resource-booking-platform"
version = "1.0.0"
description = "Платформа бронирования ресурсов для нескольких организаций"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]==5.5.3",
  "dj-database-url==3.0.1",
  "django==5.2.4",
  "djangorestframework==3.16.0",
  "djangorestframework-simplejwt==5.5.1",
  "drf-spectacular==0.28.0",
  "psycopg[binary]==3.2.9",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "pytest-django==4.11.1",
  "ruff==0.12.4",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: API and database integration tests",
  "postgresql: tests requiring PostgreSQL locking semantics",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"config/test_settings.py" = ["F403"]

[tool.coverage.run]
source = ["apps", "config"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
